name: macOS

# Build bản macOS (thư mục macos/) và đính kèm .dmg / .zip.
# - Push lên nhánh macos hoặc PR có sửa macos/ → build + tải file ở mục Artifacts.
# - Push tag dạng mac-v0.1.0 → tạo GitHub Release cho bản macOS.
on:
  push:
    branches: [macos, main, develop]
    paths: ['macos/**', 'assets/**', 'data/**', '.github/workflows/macos.yml']
    tags: ['mac-v*']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build GenPiYi.app (universal)
        working-directory: macos
        run: |
          VERSION="${GITHUB_REF_NAME#mac-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="0.1.1"; fi
          VERSION="$VERSION" ./scripts/build-app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenPiYi-macos
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/dist/*.dmg
            macos/dist/*.zip
          generate_release_notes: true
          body: |
            ## ⬇️ GenPiYi cho macOS / for macOS

            Tải **`GenPiYi-….dmg`**, mở ra và kéo **GenPiYi** vào **Applications**. Cần macOS 13 Ventura trở lên (chip Apple & Intel).
            Download **`GenPiYi-….dmg`**, open it and drag **GenPiYi** into **Applications**. Requires macOS 13 Ventura or later (Apple silicon & Intel).

            > **Lần đầu mở bị chặn?** App chưa được Apple công chứng (notarize). Vào **Cài đặt hệ thống → Quyền riêng tư & Bảo mật → Vẫn mở**, hoặc chạy:
            > **Blocked on first launch?** The app isn't notarized yet. Go to **System Settings → Privacy & Security → Open Anyway**, or run:
            > ```
            > xattr -dr com.apple.quarantine /Applications/GenPiYi.app
            > ```
