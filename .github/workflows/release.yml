name: Release

# Tạo bản phát hành khi push tag dạng v1.2.0:
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (win-x64, win-arm64)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if (-not ($version -match '^\d+\.\d+\.\d+')) { $version = "0.0.0-dev" }
          foreach ($rid in @('win-x64', 'win-arm64')) {
            dotnet publish genpiyi/genpiyi.csproj -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true `
              -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true `
              -p:DebugType=none `
              -p:Version=$version `
              -o "publish/$rid"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "GenPiYi-${{ github.ref_name }}-$rid.zip" -Force
            # Kèm file .exe chạy trực tiếp (single-file, đã gói sẵn .NET)
            Copy-Item "publish/$rid/GenPiYi.exe" "GenPiYi-${{ github.ref_name }}-$rid.exe" -Force
          }

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GenPiYi-*.exe
            GenPiYi-*.zip
          generate_release_notes: true

      - name: Upload artifacts (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: GenPiYi-build
          path: |
            GenPiYi-*.exe
            GenPiYi-*.zip
