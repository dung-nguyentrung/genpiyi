name: macOS

# Build bản macOS (thư mục macos/) và đính kèm .dmg / .zip.
# - Push lên nhánh macos hoặc PR có sửa macos/ → build + tải file ở mục Artifacts.
# - Push tag dạng mac-v0.1.0 → tạo GitHub Release cho bản macOS.
on:
  push:
    branches: [macos, main, develop]
    paths: ['macos/**', 'assets/**', 'data/**', '.github/workflows/macos.yml']
    tags: ['mac-v*']
  pull_request:
    paths: ['macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build GenPiYi.app (universal)
        working-directory: macos
        run: |
          VERSION="${GITHUB_REF_NAME#mac-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then VERSION="0.1.2"; fi
          VERSION="$VERSION" ./scripts/build-app.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenPiYi-macos
          path: |
            macos/dist/*.dmg
            macos/dist/*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/dist/*.dmg
            macos/dist/*.zip
          generate_release_notes: true
          body: |
            ## ⬇️ GenPiYi cho macOS / for macOS

            Cần macOS 13 Ventura trở lên (chip Apple & Intel). / Requires macOS 13 Ventura or later (Apple silicon & Intel).

            ### Cách 1 — Một dòng lệnh (khuyên dùng) / One-line install (recommended)
            Mở **Terminal**, dán dòng dưới rồi bấm Enter. Không bị macOS cảnh báo, chạy lại để cập nhật.
            Open **Terminal** and paste this. No Gatekeeper warning; run it again to update.
            ```
            curl -fsSL https://raw.githubusercontent.com/dung-nguyentrung/genpiyi/main/macos/install.sh | bash
            ```

            ### Cách 2 — File .dmg / .dmg file
            Tải **`GenPiYi-….dmg`** bên dưới, mở ra và kéo **GenPiYi** vào **Applications**.
            Download **`GenPiYi-….dmg`** below, open it and drag **GenPiYi** into **Applications**.

            > **Bị báo “không thể xác minh không có phần mềm độc hại”?** App miễn phí nên chưa được Apple công chứng (notarize), không phải virus — mã nguồn mở hoàn toàn tại repo này. Bấm **Xong**, rồi vào **Cài đặt hệ thống → Quyền riêng tư & Bảo mật**, kéo xuống cuối, bấm **Vẫn mở**. Chỉ cần làm một lần.
            >
            > **“Can't verify it's free of malware”?** The app is free and not notarized by Apple — the full source is in this repo. Click **Done**, then go to **System Settings → Privacy & Security**, scroll down and click **Open Anyway**. You only need to do this once.
            >
            > ![Open Anyway](https://raw.githubusercontent.com/dung-nguyentrung/genpiyi/main/docs/img/macos-open-anyway.svg)
